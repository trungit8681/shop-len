server:
  port: 8080
spring:
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shoplen}
    username: ${SPRING_DATASOURCE_USERNAME:shoplen}
    password: ${SPRING_DATASOURCE_PASSWORD:local-only-change-me}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_PROPERTIES_MAIL_SMTP_STARTTLS_ENABLE:false}
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:ChangeMe123!}
    email: ${APP_ADMIN_EMAIL:admin@shoplen.local}
  jwt:
    secret: ${APP_JWT_SECRET}
  frontend:
    customer-url: ${APP_CUSTOMER_URL:http://localhost:3000}
    admin-url: ${APP_ADMIN_URL:http://localhost:3001}
  mail:
    from: ${APP_MAIL_FROM:no-reply@shoplen.local}
  shipping:
    default-fee: ${APP_DEFAULT_SHIPPING_FEE:0}
  upload-directory: ${APP_UPLOAD_DIR:./uploads}
